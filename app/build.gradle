apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'


android {
    namespace "com.lindum.mlkit.vision.dev"
    compileSdk 35
    sourceSets {
        main {
            res.srcDirs = [
                    'src/main/res/layout/datacenter',
                    'src/main/res/layout/personal',
                    'src/main/res/layout/result',
                    'src/main/res/layout/main',
                    'src/main/res/layout/train',
                    'src/main/res'
            ]
        }
    }
    buildFeatures {
        dataBinding true
    }
    defaultConfig {
        applicationId 'com.lindum.mlkit.vision.dev'
        minSdkVersion 26
        multiDexEnabled true
        targetSdkVersion 33
        versionCode 11
        versionName "1.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        setProperty("archivesBaseName", "vision-quickstart")
    }
    buildTypes {
        proguard {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'proguard.cfg'
            testProguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguardTest-rules.pro', 'proguard.cfg'
            signingConfig signingConfigs.debug
        }
        testBuildType "proguard"
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/License.ASF20.txt'
        exclude 'META-INF/NOTICE.txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Do NOT compress tf lite model files (need to call out to developers!)
    aaptOptions {
        noCompress "tflite"
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    // Depending on AndroidX Snapshot Builds to get the latest CameraX libs.
    maven { url 'https://androidx.dev/snapshots/builds/6787662/artifacts/repository/' }
}

dependencies {
    // 纵向时间轴
    implementation 'com.vivian.widgets:TimeLineItemDecoration:1.5'
    // 书写文字
    implementation 'com.github.sarnavakonar:TextWriter:v1.0'
    // 进度条
    implementation 'com.github.warkiz.tickseekbar:tickseekbar:0.1.4'
    // intro
    implementation 'com.ramotion.paperonboarding:paper-onboarding:1.1.3'
    // calendar
    implementation 'com.haibin:calendarview:3.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    //工具类
    implementation 'com.github.xuexiangjys.XUtil:xutil-core:2.0.0'
    implementation 'com.github.xuexiangjys.XUtil:xutil-sub:2.0.0'

    // 权限请求框架
    implementation 'com.github.getActivity:XXPermissions:18.0'

    // Logger
    implementation 'com.orhanobut:logger:2.2.0'
    // TabBar
    implementation 'com.jpeng:JPTabBar:1.4.0'
    // DecoView
    implementation 'com.github.bmarrdev:android-DecoView-charting:v1.2'
    // XUI
    implementation 'com.github.xuexiangjys:XUI:1.1.8'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    // jsoup
    implementation 'org.jsoup:jsoup:1.12.1'
    // fastJson
    implementation 'com.alibaba:fastjson:1.2.79'

    implementation 'androidx.multidex:multidex:2.0.1'

    // Pose detection with default models
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta1'
    // Pose detection with accurate models
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta1'

    implementation 'com.google.mlkit:camera:16.0.0-beta1'
    // -------------------------------------------------------

    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.guava:guava:27.1-android'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.compose.ui:ui-unit-android:1.8.1'

    // For how to setup gradle dependencies in Android X, see:
    // https://developer.android.com/training/testing/set-up-project#gradle-dependencies
    // Core library
    androidTestImplementation 'androidx.test:core:1.3.0'

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.3.0'

    // Assertions
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'

    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-livedata:2.3.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.3.1"

    implementation 'nl.dionsegijn:konfetti-xml:2.0.5'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    // CameraX
    implementation "androidx.camera:camera-camera2:1.0.0-SNAPSHOT"
    implementation "androidx.camera:camera-lifecycle:1.0.0-SNAPSHOT"
    implementation "androidx.camera:camera-view:1.0.0-SNAPSHOT"

    // On Device Machine Learnings
    implementation "com.google.android.odml:image:1.0.0-beta1"
}

configurations {
    // Resolves dependency conflict caused by some dependencies use
    // com.google.guava:guava and com.google.guava:listenablefuture together.
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}
